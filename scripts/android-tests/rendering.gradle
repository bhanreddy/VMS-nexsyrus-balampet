// Add native regression tests without editing generated Android project files.
gradle.beforeProject { project ->
    if (project.path == ':react-native-screens') {
        project.afterEvaluate {
            project.android.sourceSets.test.java.srcDir(
                new File(project.rootDir, '../scripts/android-tests/src'))
            project.android.testOptions.unitTests.includeAndroidResources = true
            project.dependencies.add('testImplementation', 'junit:junit:4.13.2')
            project.dependencies.add('testImplementation', 'org.robolectric:robolectric:4.15.1')
            project.tasks.withType(Test).configureEach {
                systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            }
        }
    }
}
